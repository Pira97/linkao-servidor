; ============================================================
;  LOGROS - configuracion del sistema de logros basico
; ============================================================
; Tipos:
;   nivel  - alcanzar el nivel Objetivo (retroactivo al loguear)
;   tiempo - Objetivo minutos conectado (Repetible=1 se repite cada ciclo)
;   minar  - extraer Objetivo unidades del mineral Target (194=Oro, 192=Hierro)
;   npc    - matar Objetivo NPCs con NpcIndex en Target (coma) o nombre que contenga Target
; Reward: tokens separados por ; -> OBJ:indice:cantidad | ORO:cantidad
; Objetos utiles: 509=Scroll x2 Experiencia, 516=Scroll x2 Oro,
;   38=Pocion Roja, 37=Pocion Azul, 39=Pocion Verde, 36=Pocion Amarilla,
;   1499=Pendiente del Sacrificio (1/3), 414=Piel de Lobo, 1145=Piel de Lobo Invernal, 415=Piel de Oso Pardo
; NPCs: 501=Lobo, 580=Lobo Invernal, 538=Oso Pardo

; --- Niveles: scrolls de experiencia y oro ---
[LOGRO1]
Desc=Alcanza el nivel 10
Tipo=nivel
Objetivo=10
Reward=OBJ:509:1;OBJ:516:1

[LOGRO2]
Desc=Alcanza el nivel 20
Tipo=nivel
Objetivo=20
